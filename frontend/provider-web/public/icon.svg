<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Glavyx Provider">
  <!--
    Full-bleed on purpose (task 368): this file is the source the PNG icon
    set beside it is rasterized from, and an app icon must not round its own
    corners. iOS masks an apple-touch-icon to its own squircle and fills any
    transparency it finds outside that mask with black, so a rounded
    rectangle drawn here would produce black corners on a home screen.
    Android applies its own adaptive-icon shape for the same reason. Both
    platforms want a square, edge-to-edge, fully opaque icon and do the
    rounding themselves.

    Glyph is `GlavyxMark` from customer-web's SiteHeader.tsx, scaled up:
    same brand-600 background, same 24x24 stroke-based ring+crossbar "G",
    scaled ~12.8x and centered so it fills roughly the same proportion of
    this square as it does inside that component's own 40x40 badge - kept
    in sync with that source so the mark doesn't drift between surfaces
    (see this app's own auth-ui.tsx logo, edited alongside this file for the
    same reason).
  -->
  <rect width="512" height="512" fill="#764AE7" />
  <g transform="translate(102.4,102.4) scale(12.8)">
    <circle
      cx="12"
      cy="12"
      r="9"
      fill="none"
      stroke="#ffffff"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-dasharray="44 13"
      transform="rotate(40 12 12)"
    />
    <line x1="13.5" y1="12" x2="21" y2="12" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
