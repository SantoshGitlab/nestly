<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nestly">
  <!--
    App-icon rendering of the same mark as SiteHeader.tsx's NestlyMark /
    auth-ui.tsx's AuthShell logo (house glyph on the brand gradient), traced
    to the brand-gradient stops in tailwind.config.ts / globals.css (the
    brand-700, brand-500 and brand-400 custom properties) rather than
    referencing those properties by name, which a standalone SVG file has no
    cascade to resolve.

    Those names are written without their leading dashes on purpose: this is
    an XML comment, and a literal double hyphen inside one is a
    well-formedness error, not a stylistic issue. It made this file fail to
    parse in every XML-strict SVG consumer - which is all of them - so the
    icon it defines rendered nowhere at all (found and fixed by task 368).

    Full-bleed background with the glyph kept well inside a centered safe
    zone (~42% of the canvas) so this single file is valid for both the
    "any" and "maskable" manifest purposes - a maskable consumer (Android's
    adaptive-icon system) crops to a circle/squircle/rounded-square of its
    own choosing, and only content within that safe zone is guaranteed to
    survive the crop.
  -->
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(9,61,128)" />
      <stop offset="55%" stop-color="rgb(45,111,194)" />
      <stop offset="100%" stop-color="rgb(96,152,215)" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#brand)" />
  <g transform="translate(256,256) scale(9) translate(-12,-12.5)">
    <path
      d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1v-7.5Z"
      fill="#ffffff"
    />
  </g>
</svg>
